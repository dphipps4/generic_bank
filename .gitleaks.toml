# gitleaks: the default rules, plus the few known false positives below, each by exact path.
# just secrets-scan reads this, and so does CI's scan of every built image's filesystem.

[extend]
useDefault = true

# Node's own V8 header in the base image (node:22-bookworm-slim): `kApiTaggedSize = ...` is a
# C++ constant whose name contains "Api", not a key.
[[allowlists]]
description = "Node's V8 header in the base image"
targetRules = ["generic-api-key"]
paths = ['''^usr/local/include/node/v8-internal\.h$''']
