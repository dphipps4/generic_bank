<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" width="1240" height="910" role="img" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'><title>Generic Bank: the shape in one picture</title><desc>Callers reach the app box. The app box holds no durable data; the data box holds everything and reaches nothing. The factory box is created per session. The runner is the only path to the bank tenants, which stand in for the outside world.</desc><defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7b7b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4d7a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0484f"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f5fb0"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0707a"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f8f8f"/></marker><style>.zone{font-size:11px;font-weight:700;letter-spacing:.11em}.ttl{font-size:13.5px;font-weight:650;fill:#15304a}.sub{font-size:11px;fill:#45586b}.fl{font-size:10.5px}.badge{font-size:11px;font-weight:700;fill:#ffffff}.lane{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#8a8a8a}.note{font-size:11px;fill:#6e6e6e;font-style:italic}.chip{font-size:10.5px;fill:#45586b}.tag{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;fill:#8a8a8a}</style></defs><rect width="1240" height="910" fill="#ffffff"/><text class="zone" x="30" y="64" text-anchor="start" fill="#6e6e6e">CALLERS AND PEOPLE</text>
<rect x="30" y="80" width="180" height="74" rx="9" fill="#eef3f8" stroke="#9db8d0" stroke-width="1.5"/>
<text class="ttl" x="44" y="106">Your AI agent</text>
<text class="sub" x="44" y="125">member ID + typed task</text>
<text class="sub" x="44" y="141">never sees the UI</text>
<rect x="30" y="176" width="180" height="92" rx="9" fill="#eef3f8" stroke="#9db8d0" stroke-width="1.5"/>
<text class="ttl" x="44" y="202">Approvers, operators</text>
<text class="sub" x="44" y="221">approve every transfer</text>
<text class="sub" x="44" y="237">enter staff codes</text>
<text class="sub" x="44" y="253">review and promote drivers</text>
<rect x="250" y="34" width="500" height="494" rx="14" fill="none" stroke="#c9c4b8" stroke-width="1.3" stroke-dasharray="5 4"/>
<text class="zone" x="268" y="58" fill="#6e6e6e">APP BOX · NO DURABLE DATA</text>
<text class="tag" x="732" y="58" text-anchor="end">just backend · console · crawlers</text>
<rect x="272" y="76" width="210" height="80" rx="9" fill="#e9f2ec" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="286" y="102">Task API</text>
<text class="sub" x="286" y="121">Fastify · zod contracts</text>
<text class="sub" x="286" y="137">one typed result per task</text>
<rect x="272" y="186" width="210" height="80" rx="9" fill="#e9f2ec" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="286" y="212">Console</text>
<text class="sub" x="286" y="231">AdminJS over Prisma</text>
<text class="sub" x="286" y="247">approval inbox · hazard lab</text>
<rect x="518" y="76" width="210" height="80" rx="9" fill="#e9f2ec" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="532" y="102">Workflow engine</text>
<text class="sub" x="532" y="121">DBOS · state in Postgres</text>
<text class="sub" x="532" y="137">durable waits for people</text>
<rect x="272" y="300" width="456" height="216" rx="9" fill="#f6faf7" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="286" y="326">Runner: the crawlers</text>
<text class="sub" x="286" y="345">one headless Chromium per task; the page runs its own JavaScript,</text>
<text class="sub" x="286" y="361">and we read the drawn result from outside it</text>
<rect x="290" y="370" width="200" height="62" rx="9" fill="#ffffff" stroke="#c8ced6" stroke-width="1.5"/>
<text class="ttl" x="304" y="396">Screen model</text>
<text class="sub" x="304" y="415">layout · accessibility · images</text>
<text class="sub" x="304" y="431">no selectors, ever</text>
<rect x="510" y="370" width="200" height="62" rx="9" fill="#ffffff" stroke="#c8ced6" stroke-width="1.5"/>
<text class="ttl" x="524" y="396">Drivers</text>
<text class="sub" x="524" y="415">one per vendor product</text>
<text class="sub" x="524" y="431">a profile per bank</text>
<rect x="290" y="444" width="200" height="62" rx="9" fill="#fdecec" stroke="#cf7f7f" stroke-width="1.5"/>
<text class="ttl" x="304" y="470">Guardrails</text>
<text class="sub" x="304" y="489">job allowlist · secret typing</text>
<text class="sub" x="304" y="505">the approval grant</text>
<rect x="510" y="444" width="200" height="62" rx="9" fill="#ffffff" stroke="#c8ced6" stroke-width="1.5"/>
<text class="ttl" x="524" y="470">Evidence</text>
<text class="sub" x="524" y="489">masked before any write</text>
<text class="sub" x="524" y="505">withheld if not provable</text>
<rect x="790" y="34" width="420" height="494" rx="14" fill="none" stroke="#c9c4b8" stroke-width="1.3" stroke-dasharray="5 4"/>
<text class="zone" x="808" y="58" fill="#6e6e6e">DATA BOX · NO PUBLIC ADDRESS</text>
<text class="tag" x="1192" y="58" text-anchor="end">just data</text>
<rect x="812" y="76" width="376" height="80" rx="9" fill="#fdf6e3" stroke="#d8c07a" stroke-width="1.5"/>
<text class="ttl" x="826" y="102">Postgres + pgvector</text>
<text class="sub" x="826" y="121">control · workflow state · registry · memory schemas</text>
<text class="sub" x="826" y="137">one Prisma schema per owner</text>
<rect x="812" y="176" width="376" height="80" rx="9" fill="#fdecec" stroke="#d99b9b" stroke-width="1.5"/>
<text class="ttl" x="826" y="202">Secrets · SOPS</text>
<text class="sub" x="826" y="221">encrypted files; each service gets only its own</text>
<text class="sub" x="826" y="237">staff passwords to the Runner, factory and banks</text>
<rect x="812" y="276" width="376" height="80" rx="9" fill="#fdf6e3" stroke="#d8c07a" stroke-width="1.5"/>
<text class="ttl" x="826" y="302">MinIO</text>
<text class="sub" x="826" y="321">masked frames, screen models, run folders</text>
<text class="sub" x="826" y="337">manifests with sha256, written last</text>
<rect x="812" y="376" width="376" height="112" rx="9" fill="#e8f3f3" stroke="#86b8b8" stroke-width="1.5"/>
<text class="ttl" x="826" y="402">Memory service</text>
<text class="sub" x="826" y="421">episodes · facts · lessons, versioned and append-only</text>
<text class="sub" x="826" y="437">models propose; evidence decides;</text>
<text class="sub" x="826" y="453">code applies the rules · seeded</text>
<text class="sub" x="826" y="469">hash-chained change log</text>
<rect x="250" y="572" width="500" height="300" rx="14" fill="none" stroke="#b7aed6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text class="zone" x="268" y="596" fill="#6f5fb0">FACTORY BOX · DISPOSABLE</text>
<text class="tag" x="732" y="596" text-anchor="end">just factory</text>
<rect x="272" y="614" width="210" height="96" rx="9" fill="#f0eef6" stroke="#a9a0c4" stroke-width="1.5"/>
<text class="ttl" x="286" y="640">Factory agents</text>
<text class="sub" x="286" y="659">Scout reads the bank</text>
<text class="sub" x="286" y="675">Supervisor checks every step</text>
<text class="sub" x="286" y="691">caps in code · closed tools</text>
<rect x="518" y="614" width="210" height="96" rx="9" fill="#f0eef6" stroke="#a9a0c4" stroke-width="1.5"/>
<text class="ttl" x="532" y="640">Scout's browser</text>
<text class="sub" x="532" y="659">one live browser</text>
<text class="sub" x="532" y="675">read-only session</text>
<text class="sub" x="532" y="691">secrets typed by the server</text>
<rect x="272" y="730" width="456" height="124" rx="14" fill="none" stroke="#b7aed6" stroke-width="1.3" stroke-dasharray="5 4"/>
