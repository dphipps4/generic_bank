<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500" role="img" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'><title>A driver's life: from draft to promoted, and back through repair</title><desc>A driver version moves from draft to candidate to probation to promoted, and is retired when a newer one is promoted. Faults in real use demote it, the previous version serves, and a repair case starts a new draft. A guard trip freezes a bank until a person clears it; a run that goes quiet is marked stuck.</desc><defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7b7b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0484f"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f5fb0"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f8f62"/></marker><pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#efeaf8"/><rect width="3" height="8" fill="#e2daf3"/></pattern><style>.lane{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#8a8a8a}.ttl{font-size:14px;font-weight:650;fill:#15304a}.sub{font-size:11px;fill:#45586b}.fl{font-size:10.5px;fill:#5a5a5a}.halo{stroke:#ffffff;stroke-width:7;fill:none}.note{font-size:11px;fill:#6e6e6e;font-style:italic}.lg{font-size:10.5px;fill:#45586b}</style></defs>
<rect width="1240" height="500" fill="#ffffff"/>
<rect x="20" y="20" width="1200" height="246" rx="10" fill="#fafbfc" stroke="#e3e6ea"/>
<text class="lane" x="36" y="42">A DRIVER VERSION'S LIFE</text>
<rect x="20" y="276" width="1200" height="146" rx="10" fill="#fafbfc" stroke="#e3e6ea" stroke-dasharray="5 4"/>
<text class="lane" x="36" y="298">WHEN SOMETHING GOES WRONG</text>

<!-- main row -->
<rect x="56" y="72" width="170" height="78" rx="9" fill="#f1f2f4" stroke="#b7bcc3" stroke-width="1.5"/>
<text class="ttl" x="72" y="100">Draft</text>
<text class="sub" x="72" y="120">the factory is writing it</text>
<text class="sub" x="72" y="136">from the pictures it sees</text>

<rect x="296" y="72" width="170" height="78" rx="9" fill="#eef3f8" stroke="#9db8d0" stroke-width="1.5"/>
<text class="ttl" x="312" y="100">Candidate</text>
<text class="sub" x="312" y="120">a person approved it;</text>
<text class="sub" x="312" y="136">now the hazard check</text>

<rect x="536" y="72" width="170" height="78" rx="9" fill="#fbf3e2" stroke="#d9b56a" stroke-width="1.5"/>
<text class="ttl" x="552" y="100">Probation</text>
<text class="sub" x="552" y="120">proving itself on</text>
<text class="sub" x="552" y="136">real runs</text>

<rect x="776" y="72" width="170" height="78" rx="9" fill="#e9f2ec" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="792" y="100">Promoted</text>
<text class="sub" x="792" y="120">serves every task</text>
<text class="sub" x="792" y="136">for this bank</text>

<rect x="1016" y="72" width="170" height="78" rx="9" fill="#ffffff" stroke="#b7bcc3" stroke-width="1.5"/>
<text class="ttl" x="1032" y="100">Retired</text>
<text class="sub" x="1032" y="120">a newer version</text>
<text class="sub" x="1032" y="136">took its place</text>

<path class="halo" d="M226,111 H296"/><path d="M226,111 H294" stroke="#7b7b7b" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<text class="fl" x="261" y="102" text-anchor="middle">approved</text>
<path class="halo" d="M466,111 H536"/><path d="M466,111 H534" stroke="#7b7b7b" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<text class="fl" x="501" y="102" text-anchor="middle">every hazard</text>
<text class="fl" x="501" y="132" text-anchor="middle">passed</text>
<path class="halo" d="M706,111 H776"/><path d="M706,111 H774" stroke="#4f8f62" stroke-width="1.6" fill="none" marker-end="url(#a-green)"/>
<text class="fl" x="741" y="102" text-anchor="middle">two clean</text>
<text class="fl" x="741" y="132" text-anchor="middle">runs</text>
<path class="halo" d="M946,111 H1016"/><path d="M946,111 H1014" stroke="#7b7b7b" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<text class="fl" x="981" y="102" text-anchor="middle">replaced</text>

<!-- probation regression back to candidate -->
<path class="halo" d="M621,150 V186 Q621,196 611,196 H391 Q381,196 381,186 V152"/>
<path d="M621,150 V186 Q621,196 611,196 H391 Q381,196 381,186 V154" stroke="#7b7b7b" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#a-grey)"/>
<text class="fl" x="501" y="190" text-anchor="middle">a failure on probation: built again, once</text>

<!-- demoted -->
<rect x="776" y="186" width="170" height="64" rx="9" fill="#fbecec" stroke="#d98a8f" stroke-width="1.5"/>
<text class="ttl" x="792" y="212">Demoted</text>
<text class="sub" x="792" y="232">the previous version serves</text>
<path class="halo" d="M861,150 V186"/><path d="M861,150 V184" stroke="#c0484f" stroke-width="1.6" fill="none" marker-end="url(#a-red)"/>
<text class="fl" x="869" y="172">a fault in real use</text>
<path class="halo" d="M776,232 H151 Q141,232 141,222 V152"/>
<path d="M776,232 H151 Q141,232 141,222 V154" stroke="#c0484f" stroke-width="1.6" fill="none" marker-end="url(#a-red)"/>
<text class="fl" x="455" y="226" text-anchor="middle">repair: a new draft from the old profile and the failing run's pictures</text>

<!-- frozen and stuck -->
<rect x="56" y="318" width="260" height="78" rx="9" fill="url(#stripes)" stroke="#a593d6" stroke-width="1.5"/>
<text class="ttl" x="72" y="346">Frozen</text>
<text class="sub" x="72" y="366">a guard tripped: nothing runs</text>
<text class="sub" x="72" y="382">at this bank until a person clears it</text>
<path class="halo" d="M316,357 H436"/><path d="M316,357 H434" stroke="#6f5fb0" stroke-width="1.6" fill="none" marker-end="url(#a-violet)"/>
<text class="fl" x="376" y="348" text-anchor="middle">cleared, with</text>
<text class="fl" x="376" y="374" text-anchor="middle">a reason</text>
<rect x="436" y="326" width="190" height="62" rx="9" fill="#ffffff" stroke="#b7bcc3" stroke-width="1.5"/>
<text class="ttl" x="452" y="352">Back as it was</text>
<text class="sub" x="452" y="372">the state before the trip</text>

<rect x="776" y="318" width="250" height="78" rx="9" fill="#fdf0e4" stroke="#e0a26b" stroke-width="1.5"/>
<text class="ttl" x="792" y="346">Stuck</text>
<text class="sub" x="792" y="366">a run went quiet past its limit;</text>
<text class="sub" x="792" y="382">a person looks</text>

<!-- legend -->
<g transform="translate(36,446)">
<text class="lane" x="0" y="12">THE BADGES IN THE CONSOLE</text>
<rect x="0" y="24" width="14" height="14" rx="3" fill="#f1f2f4" stroke="#b7bcc3"/><text class="lg" x="20" y="35">draft</text>
<rect x="80" y="24" width="14" height="14" rx="3" fill="#eef3f8" stroke="#9db8d0"/><text class="lg" x="100" y="35">candidate</text>
<rect x="180" y="24" width="14" height="14" rx="3" fill="#fbf3e2" stroke="#d9b56a"/><text class="lg" x="200" y="35">probation</text>
<rect x="280" y="24" width="14" height="14" rx="3" fill="#e9f2ec" stroke="#8fb79c"/><text class="lg" x="300" y="35">promoted</text>
<rect x="378" y="24" width="14" height="14" rx="3" fill="#fbecec" stroke="#d98a8f"/><text class="lg" x="398" y="35">demoted</text>
<rect x="470" y="24" width="14" height="14" rx="3" fill="url(#stripes)" stroke="#a593d6"/><text class="lg" x="490" y="35">frozen</text>
<rect x="550" y="24" width="14" height="14" rx="3" fill="#fdf0e4" stroke="#e0a26b"/><text class="lg" x="570" y="35">stuck</text>
<rect x="622" y="24" width="14" height="14" rx="3" fill="#ffffff" stroke="#b7bcc3"/><text class="lg" x="642" y="35">retired</text>
</g>
</svg>
