<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'><title>The software factory: two agents learn a bank, a person approves, the bank's own results decide</title><desc>The Scout takes one step at a time on the bank's website. The Supervisor looks at every page it reaches, decides the next step, and drafts the bank's profile, every claim citing the pages that show it, marked seen or guess. A person approves the draft; the profile is run against the bank with each hazard forced, then on probation; two clean runs promote it to a deterministic driver that serves tasks with no model. When the bank changes and the driver fails, it is demoted and the factory repairs it from the failing run's pages.</desc><defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7b7b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4d7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f8f62"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0484f"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f5fb0"/></marker><style>.lane{font-size:10.5px;font-weight:700;letter-spacing:.12em;fill:#8a8a8a}.ttl{font-size:14px;font-weight:650;fill:#15304a}.sub{font-size:11px;fill:#45586b}.fl{font-size:10.5px;fill:#5a5a5a}.halo{stroke:#ffffff;stroke-width:7;fill:none}.badge{font-size:11px;font-weight:700;fill:#ffffff}.note{font-size:11px;fill:#6e6e6e;font-style:italic}</style></defs>
<rect width="1240" height="640" fill="#ffffff"/>

<!-- lanes -->
<rect x="20" y="20" width="1200" height="236" rx="10" fill="#fafbfc" stroke="#e3e6ea"/>
<text class="lane" x="36" y="42">1 · LEARN THE BANK (MODELS AT WORK)</text>
<rect x="20" y="266" width="1200" height="150" rx="10" fill="#fafbfc" stroke="#e3e6ea"/>
<text class="lane" x="36" y="288">2 · THE GATE (A PERSON, THEN THE BANK'S OWN RESULTS)</text>
<rect x="20" y="426" width="1200" height="194" rx="10" fill="#fafbfc" stroke="#e3e6ea"/>
<text class="lane" x="36" y="448">3 · IN SERVICE (NO MODEL)</text>

<!-- lane 1 -->
<rect x="56" y="80" width="190" height="84" rx="9" fill="#f1f2f4" stroke="#b7bcc3" stroke-width="1.5"/>
<text class="ttl" x="72" y="108">The bank's website</text>
<text class="sub" x="72" y="128">its staff screens, as they are</text>
<text class="sub" x="72" y="144">today</text>

<rect x="326" y="80" width="200" height="84" rx="9" fill="#eef3f8" stroke="#9db8d0" stroke-width="1.5"/>
<circle cx="346" cy="101" r="10" fill="#9db8d0"/><text class="badge" x="346" y="105" text-anchor="middle">A</text>
<text class="ttl" x="364" y="106">Scout</text>
<text class="sub" x="342" y="128">navigates: one simple step</text>
<text class="sub" x="342" y="144">at a time, as it is told</text>

<rect x="606" y="80" width="230" height="84" rx="9" fill="#efeaf8" stroke="#a593d6" stroke-width="1.5"/>
<circle cx="626" cy="101" r="10" fill="#a593d6"/><text class="badge" x="626" y="105" text-anchor="middle">B</text>
<text class="ttl" x="644" y="106">Supervisor</text>
<text class="sub" x="622" y="128">looks at every page, reasons,</text>
<text class="sub" x="622" y="144">decides the next step</text>

<rect x="916" y="72" width="270" height="100" rx="9" fill="#fbf3e2" stroke="#d9b56a" stroke-width="1.5"/>
<text class="ttl" x="932" y="100">Recommendation</text>
<text class="sub" x="932" y="120">the bank's profile: its words,</text>
<text class="sub" x="932" y="136">screens and refusals; every claim</text>
<text class="sub" x="932" y="152">cites pictures, seen or guess</text>

<rect x="606" y="196" width="230" height="46" rx="9" fill="#ffffff" stroke="#b7bcc3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="sub" x="622" y="216">Memory: what other banks taught</text>
<text class="sub" x="622" y="232">in; lessons from this run out</text>

<path class="halo" d="M326,110 H246"/><path d="M326,110 H248" stroke="#1f4d7a" stroke-width="1.6" fill="none" marker-end="url(#a-blue)"/>
<text class="fl" x="286" y="102" text-anchor="middle">one step</text>
<path class="halo" d="M151,164 V186 Q151,190 155,190 H496 Q500,190 500,186"/>
<path d="M151,164 V186 Q151,190 155,190 H716 Q721,190 721,184 V166" stroke="#7b7b7b" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<text class="fl" x="290" y="184">every page: a picture and its visible text, with personal details covered</text>
<path class="halo" d="M606,128 H526"/><path d="M606,128 H528" stroke="#6f5fb0" stroke-width="1.6" fill="none" marker-end="url(#a-violet)"/>
<text class="fl" x="566" y="146" text-anchor="middle">next step</text>
<path class="halo" d="M836,122 H916"/><path d="M836,122 H914" stroke="#7b7b7b" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<text class="fl" x="876" y="114" text-anchor="middle">goals reached</text>
<path d="M721,196 V166" stroke="#b7bcc3" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>

<!-- lane 2 -->
<rect x="56" y="318" width="250" height="78" rx="9" fill="#e9f2ec" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="72" y="344">A person approves</text>
<text class="sub" x="72" y="364">in the Console, each claim's pictures</text>
<text class="sub" x="72" y="380">one click away; guesses ticked</text>
<rect x="386" y="318" width="250" height="78" rx="9" fill="#e9f2ec" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="402" y="344">Hazard check</text>
<text class="sub" x="402" y="364">the profile against the bank with</text>
<text class="sub" x="402" y="380">every fault forced, judged by its ledger</text>
<rect x="716" y="318" width="210" height="78" rx="9" fill="#e9f2ec" stroke="#8fb79c" stroke-width="1.5"/>
<text class="ttl" x="732" y="344">Probation</text>
<text class="sub" x="732" y="364">two clean runs in a row</text>
<text class="sub" x="732" y="380">promote it</text>

<path class="halo" d="M1051,172 V300 Q1051,306 1045,306 H187 Q181,306 181,312 V316"/>
<path d="M1051,172 V300 Q1051,306 1045,306 H187 Q181,306 181,312 V316" stroke="#7b7b7b" stroke-width="1.6" fill="none" marker-end="url(#a-grey)"/>
<path class="halo" d="M306,357 H386"/><path d="M306,357 H384" stroke="#4f8f62" stroke-width="1.6" fill="none" marker-end="url(#a-green)"/>
<path class="halo" d="M636,357 H716"/><path d="M636,357 H714" stroke="#4f8f62" stroke-width="1.6" fill="none" marker-end="url(#a-green)"/>

<!-- lane 3 -->
<rect x="716" y="468" width="250" height="84" rx="9" fill="#e9f2ec" stroke="#4f8f62" stroke-width="2"/>
<text class="ttl" x="732" y="496">Promoted driver</text>
<text class="sub" x="732" y="516">plain deterministic code; serves</text>
<text class="sub" x="732" y="532">every task at this bank, no model</text>
<path class="halo" d="M821,396 V468"/><path d="M821,396 V466" stroke="#4f8f62" stroke-width="1.6" fill="none" marker-end="url(#a-green)"/>

<rect x="386" y="468" width="250" height="84" rx="9" fill="#fbecec" stroke="#d98a8f" stroke-width="1.5"/>
<text class="ttl" x="402" y="496">The bank redesigns</text>
<text class="sub" x="402" y="516">the driver stops safely on a page</text>
<text class="sub" x="402" y="532">it doesn't know; it is demoted</text>
<path class="halo" d="M716,510 H636"/><path d="M716,510 H638" stroke="#c0484f" stroke-width="1.6" fill="none" marker-end="url(#a-red)"/>
<text class="fl" x="676" y="502" text-anchor="middle">a fault</text>

<rect x="56" y="468" width="250" height="84" rx="9" fill="#fbecec" stroke="#d98a8f" stroke-width="1.5"/>
<text class="ttl" x="72" y="496">Repair case</text>
<text class="sub" x="72" y="516">the factory starts again from the</text>
<text class="sub" x="72" y="532">old profile and the failing pictures</text>
<path class="halo" d="M386,510 H306"/><path d="M386,510 H308" stroke="#c0484f" stroke-width="1.6" fill="none" marker-end="url(#a-red)"/>
<path class="halo" d="M56,524 H34 Q30,524 30,520 V62 Q30,58 34,58 H422 Q426,58 426,62 V78"/>
<path d="M56,524 H34 Q30,524 30,520 V62 Q30,58 34,58 H422 Q426,58 426,62 V78" stroke="#c0484f" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#a-red)"/>
<text class="fl" x="240" y="72" text-anchor="middle">repair: back to the Scout, with what failed</text>

<rect x="1000" y="468" width="186" height="84" rx="9" fill="#ffffff" stroke="#b7bcc3" stroke-width="1.2"/>
<text class="sub" x="1014" y="490">Throughout: $25 a run at most;</text>
<text class="sub" x="1014" y="506">money buttons refused in code;</text>
<text class="sub" x="1014" y="522">no key, a recorded run</text>
<text class="sub" x="1014" y="538">replays for free</text>
<text class="note" x="56" y="596">The agents never move money, never run script in a page, and never leave the bank's own site.</text>
</svg>
