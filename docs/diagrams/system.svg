<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Generic Bank: the system</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2b4c7e; stroke-width: 1.5; rx: 10; }
      .core { fill: #eef4fb; }
      .bank { fill: #fdf3e7; stroke: #b7791f; }
      .person { fill: #eefaf1; stroke: #2f855a; }
      .agentic { fill: #f5f0fb; stroke: #6b46c1; }
      .t { fill: #1a202c; font-weight: 600; font-size: 14px; }
      .s { fill: #4a5568; font-size: 12px; }
      .line { stroke: #4a5568; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .dash { stroke-dasharray: 5 4; }
      .zone { fill: none; stroke: #cbd5e0; stroke-dasharray: 6 5; rx: 14; }
      .zl { fill: #718096; font-size: 12px; letter-spacing: .04em; }
    </style>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <rect class="zone" x="20" y="20" width="620" height="330"/>
  <text class="zl" x="36" y="42">CUSTOMER TASKS: NO MODEL RUNS HERE</text>
  <rect class="zone" x="20" y="370" width="620" height="170"/>
  <text class="zl" x="36" y="392">THE FACTORY: BANK 2 ONLY</text>

  <rect class="box" x="40" y="70" width="150" height="70"/>
  <text class="t" x="115" y="100" text-anchor="middle">AI agent</text>
  <text class="s" x="115" y="120" text-anchor="middle">typed inputs, typed result</text>

  <rect class="box core" x="240" y="60" width="170" height="90"/>
  <text class="t" x="325" y="88" text-anchor="middle">Task API</text>
  <text class="s" x="325" y="108" text-anchor="middle">OAuth2 · Swagger UI</text>
  <text class="s" x="325" y="126" text-anchor="middle">202 · 200 · 422 · 409 · 5xx</text>

  <rect class="box core" x="240" y="190" width="170" height="130"/>
  <text class="t" x="325" y="216" text-anchor="middle">Runner</text>
  <text class="s" x="325" y="238" text-anchor="middle">durable run per task</text>
  <text class="s" x="325" y="256" text-anchor="middle">crawler: table + loop</text>
  <text class="s" x="325" y="274" text-anchor="middle">allowlist guard, grant</text>
  <text class="s" x="325" y="292" text-anchor="middle">runtime: see, then click</text>
  <text class="s" x="325" y="310" text-anchor="middle">masked frames</text>

  <rect class="box bank" x="470" y="190" width="150" height="130"/>
  <text class="t" x="545" y="218" text-anchor="middle">Banks 1 and 2</text>
  <text class="s" x="545" y="240" text-anchor="middle">legacy staff consoles</text>
  <text class="s" x="545" y="258" text-anchor="middle">framesets, no test IDs</text>
  <text class="s" x="545" y="276" text-anchor="middle">runtime hazards</text>
  <text class="s" x="545" y="294" text-anchor="middle">driven only through</text>
  <text class="s" x="545" y="310" text-anchor="middle">their web UI</text>

  <rect class="box person" x="700" y="150" width="230" height="170"/>
  <text class="t" x="815" y="178" text-anchor="middle">Console: a person</text>
  <text class="s" x="815" y="202" text-anchor="middle">approves each transfer</text>
  <text class="s" x="815" y="220" text-anchor="middle">enters the bank's sign-in codes</text>
  <text class="s" x="815" y="238" text-anchor="middle">takes over a stopped run</text>
  <text class="s" x="815" y="256" text-anchor="middle">sees every run, page by page</text>
  <text class="s" x="815" y="274" text-anchor="middle">approves a learned table</text>
  <text class="s" x="815" y="292" text-anchor="middle">clears a freeze</text>

  <rect class="box agentic" x="40" y="410" width="250" height="110"/>
  <text class="t" x="165" y="438" text-anchor="middle">Scout and Supervisor</text>
  <text class="s" x="165" y="460" text-anchor="middle">the Scout acts and writes the table</text>
  <text class="s" x="165" y="478" text-anchor="middle">the Supervisor judges each picture</text>
  <text class="s" x="165" y="496" text-anchor="middle">metered gateway, $25 a run</text>

  <rect class="box agentic" x="340" y="410" width="150" height="110"/>
  <text class="t" x="415" y="438" text-anchor="middle">Memory</text>
  <text class="s" x="415" y="460" text-anchor="middle">lessons citing frames</text>
  <text class="s" x="415" y="478" text-anchor="middle">relied on, contradicted</text>
  <text class="s" x="415" y="496" text-anchor="middle">starts empty</text>

  <rect class="box core" x="700" y="410" width="230" height="110"/>
  <text class="t" x="815" y="438" text-anchor="middle">Registry</text>
  <text class="s" x="815" y="460" text-anchor="middle">which table serves each bank</text>
  <text class="s" x="815" y="478" text-anchor="middle">a fault demotes it</text>
  <text class="s" x="815" y="496" text-anchor="middle">and opens a repair case</text>

  <path class="line" d="M190,105 L238,105"/>
  <path class="line" d="M325,150 L325,188"/>
  <path class="line" d="M410,255 L468,255"/>
  <path class="line" d="M410,212 C460,150 640,150 698,212"/>
  <text class="s" x="470" y="160">codes, approvals, escalations</text>
  <path class="line" d="M545,320 L545,345 C545,385 330,370 250,408"/>
  <text class="s" x="556" y="352">the Scout works bank 2 live</text>
  <path class="line" d="M290,465 L338,465"/>
  <path class="line dash" d="M290,508 C500,560 660,520 712,322"/>
  <text class="s" x="420" y="548">a learned table waits for approval</text>
  <path class="line" d="M815,320 L815,408"/>
  <text class="s" x="822" y="370">approve promotes</text>
  <path class="line dash" d="M700,478 C600,470 400,430 345,322"/>
  <text class="s" x="560" y="490">serves the table</text>
</svg>
