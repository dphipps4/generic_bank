# Generic Bank, locally. Every service has a memory limit (everything just up starts fits in
# about 3.8 GB, 4.6 GB while a factory run is going), and networks enforce who may reach whom:
#   app      the app box to the data box    data     the data box only (no route out)
#   world    the banks, reached by the runner (and later the factory's browser)
#   bankdb   the banks and their own database only (no route out)
#   factory  the factory box, started by `just up`
# Ports are published on 127.0.0.1 only. Run everything through just, which names the project
# after its folder (a second copy in another folder is a separate stack).

x-node: &node
  image: ${GB_IMAGE}
  pull_policy: never
  restart: unless-stopped
  init: true
  env_file: [../../config/app.env]

# Checked every two seconds while a service starts, then every thirty. A Node healthcheck starts
# a whole Node process; every five seconds across a dozen services, that alone kept a small
# Docker VM busy and starved image builds.
x-health: &health
  start_period: 90s
  start_interval: 2s
  interval: 30s
  timeout: 5s
  retries: 3

networks:
  app: {}
  data: { internal: true }
  world: {}
  bankdb: { internal: true }
  bankdb-port: {}
  edge: {}
  factory: {}

volumes:
  postgres-data: {}
  # Masked screenshots and screen models, as files: the Runner and a factory run write them, the
  # Console and the API read them.
  evidence: {}
  bank-db-data: {}
  memory-models: {}
  sessions: {}

services:
  # ── the data box ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 384m
    env_file: [../../.run/env/postgres.env]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [app, data]
    # For a SQL client on this machine (TablePlus and the like); never beyond it.
    ports: ['127.0.0.1:${CONTROL_DB_PORT}:5432']
    # Over TCP: on first start the image runs its init script on a socket-only server, which a
    # socket check would call ready before the real server listens.
    healthcheck: { <<: *health, test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres'] }

  # Memory's own schema, applied to its own database before the service starts.
  memory-migrate:
    <<: *node
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'apps/memory/prisma/schema.prisma']
    mem_limit: 256m
    env_file: [../../config/app.env, ../../.run/env/memory-migrate.env]
    networks: [data]
    depends_on: { postgres: { condition: service_healthy } }

  # The embedding model (about 130 MB) is fetched into its own volume the first time memory
  # starts, and loaded before memory reports healthy; held in memory it is most of this limit.
  memory:
    <<: *node
    command: ['node', 'apps/memory/dist/main.js']
    mem_limit: 512m
    ports: ['127.0.0.1:${MEMORY_PORT}:8470']
    env_file: [../../config/app.env, ../../.run/env/memory.env]
    environment: { MEMORY_MODEL_DIR: /models }
    volumes: [memory-models:/models]
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }
      memory-migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8470/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # ── the app box ──────────────────────────────────────────────────────────────
  migrate:
    <<: *node
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'packages/db/prisma/schema.prisma']
    mem_limit: 256m
    env_file: [../../config/app.env, ../../.run/env/migrate.env]
    networks: [app]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *node
    command: ['node', 'apps/api/dist/main.js']
    mem_limit: 192m
    env_file: [../../config/app.env, ../../.run/env/api.env]
    ports: ['127.0.0.1:${API_PORT}:8000']
    networks: [app]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  console:
    <<: *node
    command: ['node', 'apps/console/dist/main.js']
    mem_limit: 256m
    env_file: [../../config/app.env, ../../.run/env/console.env]
    # The host ports, which a second copy moves (config/local.env): the Dashboard links to them.
    environment: { API_PORT: '${API_PORT}', BANK_INBOX_PORT: '${BANK_INBOX_PORT}' }
    ports: ['127.0.0.1:${CONSOLE_PORT}:8080']
    volumes: ['evidence:/data/evidence:ro']
    networks: [app]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  runner:
    <<: *node
    # The same Node image plus headless Chromium (infra/docker/runner.Dockerfile).
    image: ${GB_RUNNER_IMAGE}
    command: ['node', 'apps/runner/dist/main.js']
    ports: ['127.0.0.1:${RUNNER_PORT}:8100']
    # Two runs at a time (RUNNER_CONCURRENCY), each with its own browser: a transfer waiting for
    # approval holds one and never holds up the other tasks.
    mem_limit: 1536m
    env_file: [../../config/app.env, ../../.run/env/runner.env]
    # The banks' cookies, kept between runs so a code is entered once. Only the runner mounts it.
    volumes: ['evidence:/data/evidence', 'sessions:/data/sessions']
    networks: [app, world]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # ── the world: the banks ─────────────────────────────────────────────────────
  bank-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ['postgres', '-c', 'shared_buffers=32MB', '-c', 'max_connections=40']
    env_file: [../../.run/env/bank-db.env]
    volumes:
      - bank-db-data:/var/lib/postgresql/data
      - ../bank-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # bankdb is internal, and Docker publishes no port from an internal network alone: bankdb-port
    # holds only this database, so a SQL client on this machine reaches it and no service does.
    networks: [bankdb, bankdb-port]
    ports: ['127.0.0.1:${BANK_DB_PORT}:5432']
    healthcheck: { <<: *health, test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres'] }

  bank-generic: &bank
    <<: *node
    command: ['node', 'apps/bank/dist/main.js']
    # Password hashing (argon2, 19 MB a hash) runs on worker threads, and glibc gives each thread
    # its own malloc arena that it rarely hands back. Two arenas, measured on a bank with two origins:
    # 32 MB at rest and 68 MB after three sign-ins, against 47 and 86 without; seeding peaks near
    # 106 MB once. A cap on the JavaScript heap made no difference: the memory is not there.
    mem_limit: 128m
    env_file: [../../config/app.env, ../../.run/env/bank.env]
    # BANK_REDESIGN: '1' turns on the vendor's redesign: a notice after sign-in, new names and the
    # nav in a Menu, over the same ledger. Off when absent.
    environment:
      TENANT: generic
      MALLOC_ARENA_MAX: '2'
      PORT: '8081'
      ADMIN_PORT: '9000'
      # BANK_REDESIGN: '1'
    ports: ['127.0.0.1:${BANK_GENERIC_PORT}:8081', '127.0.0.1:${BANK_GENERIC_ADMIN_PORT}:9000']
    networks: [world, bankdb]
    depends_on: { bank-db: { condition: service_healthy } }
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.PORT+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  bank-example:
    <<: *bank
    # No random hazards on bank 2: the factory learns it within its clock. Forced ones still fire.
    environment:
      {
        TENANT: example,
        MALLOC_ARENA_MAX: '2',
        PORT: '8082',
        ADMIN_PORT: '9000',
        HAZARD_RUN_RATE_PCT: '0',
      }
    ports:
      - '127.0.0.1:${BANK_EXAMPLE_PORT}:8082'
      - '127.0.0.1:${BANK_EXAMPLE_ADMIN_PORT}:9000'

  # The staff inbox, where codes arrive. On its own network: people reach it, the Runner and the
  # factory cannot, so a code is always a human step.
  bank-inbox:
    <<: *node
    command: ['node', 'apps/bank/dist/inbox-main.js']
    mem_limit: 96m
    env_file: [../../config/app.env, ../../.run/env/bank-inbox.env]
    environment: { PORT: '8089', BANKS: 'generic,example' }
    ports: ['127.0.0.1:${BANK_INBOX_PORT}:8089']
    networks: [edge, bankdb]
    depends_on: { bank-db: { condition: service_healthy } }
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8089/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # ── the factory box (created per session) ────────────────────────────────────
  factory:
    <<: *node
    profiles: [factory]
    command: ['node', 'apps/factory/dist/main.js']
    ports: ['127.0.0.1:${FACTORY_PORT}:8200']
    mem_limit: 256m
    env_file: [../../config/app.env, ../../.run/env/factory.env]
    networks: [factory, app, world]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8200/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  # A factory run (just factory): the factory's own secrets, in the Runner's image for its
  # Chromium, run once and removed. Its models are reached only through the factory's gateway.
  # It starts from memory's knowledge pack, so it waits for memory.
  factory-run:
    <<: *node
    image: ${GB_RUNNER_IMAGE}
    profiles: [factory-run]
    restart: 'no'
    entrypoint: ['node', 'apps/factory/dist/cli.js']
    mem_limit: 768m
    env_file: [../../config/app.env, ../../.run/env/factory.env]
    environment: { MEMORY_URL: 'http://memory:8470' }
    volumes: ['evidence:/data/evidence']
    networks: [factory, app, world]
    depends_on: { memory: { condition: service_healthy } }
