name: ci

on:
  pull_request:
  push:
    branches: [master]
  # Every night, the whole suite and the long suite, whatever changed.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run it replaces. Master's runs all finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# Memory's embedding runtime runs on CPU: npm ci fetches no GPU libraries for it.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    name: typecheck, lint, test, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a pull request's tests can be chosen by what it changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control
      - run: npx prisma validate --schema apps/memory/prisma/schema.prisma
        env:
          MEMORY_DATABASE_URL: postgresql://ci:ci@localhost:5432/memory
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise
      - name: Headless Chromium for the browser tests
        run: infra/scripts/browser.sh
      # A pull request runs the tests its change touches; a change to migrations, seeds, config,
      # infrastructure or CI runs them all (vitest.config.ts, forceRerunTriggers). The whole suite
      # runs on every merge to master and every night, below.
      - name: The tests this change touches
        if: github.event_name == 'pull_request'
        run: npx vitest run --changed origin/${{ github.base_ref }} --passWithNoTests --reporter=default --reporter=json --outputFile.json=.run/changed.json
      # A skipped test passes; in the escalation, transfer-safety and memory suites, a skip is a failure.
      - name: Nothing in the escalation, transfer-safety and memory suites was skipped
        if: github.event_name == 'pull_request'
        run: node infra/scripts/suite-ran.mjs .run/changed.json tests/escalation tests/transfer tests/memory

  suite:
    name: the whole suite (${{ matrix.shard }} of 3)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Headless Chromium for the browser tests
        run: infra/scripts/browser.sh
      # The escalation, transfer-safety and memory suites run in their own job, below, where they are
      # counted.
      - run: npx vitest run --shard=${{ matrix.shard }}/3 --exclude 'tests/escalation/**' --exclude 'tests/transfer/**' --exclude 'tests/memory/**'

  suites:
    name: the escalation, transfer-safety and memory suites
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Headless Chromium for the browser tests
        run: infra/scripts/browser.sh
      - run: npx vitest run tests/escalation tests/transfer tests/memory --reporter=default --reporter=json --outputFile.json=.run/suites.json
      # Every test ran and passed, and there are as many as each suite has: a skip is a failure.
      - name: The suites really ran
        run: node infra/scripts/suite-ran.mjs .run/suites.json tests/escalation=9 tests/transfer=10 tests/memory=79

  long:
    name: the long suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Headless Chromium for the browser tests
        run: infra/scripts/browser.sh
      - run: npx vitest run --config vitest.long.config.ts --reporter=default --reporter=json --outputFile.json=.run/long.json
      # The transfer-safety suite's swallowed submits wait out a slow bank, so they are here.
      - name: The swallowed submits really ran
        run: node infra/scripts/suite-ran.mjs .run/long.json tests/long/swallowed-submit.test.ts=1 tests/long/transfer-swallowed.test.ts=1

  image:
    name: build what ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Node image every service runs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node.Dockerfile
          push: false
          tags: generic-bank/node:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The default builder sees images in the local daemon, so the Runner builds on the one above.
      - name: Build the Runner's image (the same plus headless Chromium)
        run: docker build --builder default -f infra/docker/runner.Dockerfile --build-arg BASE=generic-bank/node:ci -t generic-bank/runner:ci .
      # The secret scripts and the plan renderer run inside the tools image: prove they still do.
      - name: The tools image runs the scripts
        run: |
          docker build -f infra/docker/tools.Dockerfile -t generic-bank/tools:ci infra/docker
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" generic-bank/tools:ci bash -c \
            'source infra/scripts/lib.sh && sops --version && age --version && jq --version && node infra/docs/render-plan.cjs'
      # A secret baked into an image fails the build: gitleaks reads each image's whole filesystem.
      - name: No secrets in the images
        run: infra/scripts/secrets-scan.sh image generic-bank/node:ci generic-bank/runner:ci generic-bank/tools:ci
      - name: Compose file is valid
        run: |
          mkdir -p .run/env
          for s in $(jq -r '.services | keys[]' infra/secrets/scope.json); do touch ".run/env/$s.env"; done
          docker compose -f infra/compose/compose.yaml --env-file config/app.env -p generic-bank --profile '*' config -q
      # Every step is a just recipe: install just the way a person does, and check the Justfile.
      - name: The Justfile works
        run: |
          infra/scripts/bootstrap.sh
          export PATH="$HOME/.local/bin:$PATH"
          just --summary >/dev/null
          just --dry-run up >/dev/null

  secrets:
    name: no secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
