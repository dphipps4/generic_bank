name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run depcruise

  image:
    name: build what ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Node image every service runs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node.Dockerfile
          push: false
          tags: generic-bank/node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file is valid
        run: |
          mkdir -p .run/env
          for s in $(jq -r '.services | keys[]' infra/secrets/scope.json); do touch ".run/env/$s.env"; done
          docker compose -f infra/compose/compose.yaml --env-file config/app.env -p generic-bank --profile '*' config -q

  secrets:
    name: no secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
