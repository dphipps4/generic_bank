name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run it replaces. Master's runs all finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# Memory's embedding runtime runs on CPU: npm ci fetches no GPU libraries for it.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # What a pull request changed, from GitHub's API: no checkout, no install. A change to the docs
  # alone runs nothing below (a skipped job counts as passed). A merge to master runs everything.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      repair: ${{ steps.files.outputs.repair }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "repair=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          echo "$files"
          # Docs: the docs tree, Markdown and HTML anywhere, the license. Never tested.
          code=$(grep -vqE '^docs/|\.md$|\.html?$|^LICENSE$' <<< "$files" && echo true || echo false)
          repair=$(grep -qE '^(apps/factory/|packages/drivers/|packages/screen/|tests/browser/repair\.test\.ts$)' <<< "$files" && echo true || echo false)
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "repair=$repair" >> "$GITHUB_OUTPUT"

  check:
    name: typecheck, lint, boundaries
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control
      - run: npx prisma validate --schema apps/memory/prisma/schema.prisma
        env:
          MEMORY_DATABASE_URL: postgresql://ci:ci@localhost:5432/memory
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise

  # A pull request runs the tests its change touches; a change to migrations, seeds or the files
  # tests read runs them all (vitest.config.ts, forceRerunTriggers). A merge to master runs the
  # whole suite. The first failure stops the run.
  tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a pull request's tests can be chosen by what it changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - uses: actions/cache@v4
        with:
          path: .run/browser
          key: chrome-${{ runner.os }}-${{ hashFiles('infra/scripts/browser.sh') }}
      - name: Headless Chromium for the browser tests
        run: '[ -d .run/browser/chrome ] || infra/scripts/browser.sh'
      - name: The tests this change touches
        if: github.event_name == 'pull_request'
        run: npx vitest run --changed origin/${{ github.base_ref }} --passWithNoTests --bail=1 --exclude tests/browser/repair.test.ts
      - name: The whole suite
        if: github.event_name != 'pull_request'
        run: npx vitest run --bail=1 --exclude tests/browser/repair.test.ts

  # The factory's repair drives the bank end to end for minutes, so it has a machine of its own,
  # beside the other tests. A pull request runs it only when it changes the factory, the drivers,
  # the screen code or the test itself; a merge to master always does.
  repair:
    name: the factory's repair
    needs: changes
    if: needs.changes.outputs.repair == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run db:generate
      - uses: actions/cache@v4
        with:
          path: .run/browser
          key: chrome-${{ runner.os }}-${{ hashFiles('infra/scripts/browser.sh') }}
      - name: Headless Chromium
        run: '[ -d .run/browser/chrome ] || infra/scripts/browser.sh'
      - name: The repair test
        run: npx vitest run tests/browser/repair.test.ts

  secrets:
    name: no secrets in history
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
