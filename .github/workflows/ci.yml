name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control
      - run: npm run typecheck
      - run: npm run lint
      - name: Headless Chromium for the browser tests
        run: infra/scripts/browser.sh
      - run: npm run test
      - run: npm run depcruise

  image:
    name: build what ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Node image every service runs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node.Dockerfile
          push: false
          tags: generic-bank/node:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The default builder sees images in the local daemon, so the Runner builds on the one above.
      - name: Build the Runner's image (the same plus headless Chromium)
        run: docker build --builder default -f infra/docker/runner.Dockerfile --build-arg BASE=generic-bank/node:ci -t generic-bank/runner:ci .
      # The secret scripts and the plan renderer run inside the tools image: prove they still do.
      - name: The tools image runs the scripts
        run: |
          docker build -f infra/docker/tools.Dockerfile -t generic-bank/tools:ci infra/docker
          docker run --rm -v "$PWD:/work" generic-bank/tools:ci bash -c \
            'source infra/scripts/lib.sh && sops --version && age --version && jq --version && node infra/docs/render-plan.cjs'
      - name: Compose file is valid
        run: |
          mkdir -p .run/env
          for s in $(jq -r '.services | keys[]' infra/secrets/scope.json); do touch ".run/env/$s.env"; done
          docker compose -f infra/compose/compose.yaml --env-file config/app.env -p generic-bank --profile '*' config -q

  secrets:
    name: no secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
