name: ci

# A pull request gets the quick checks: about a minute, two jobs side by side, with no browser.
# A merge to master runs the whole suite, browser tests included, in parallel, and builds the
# images.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run it replaces. Master's runs all finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# Memory's embedding runtime runs on CPU: npm ci fetches no GPU libraries for it.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # What a pull request changed, from GitHub's API: no checkout, no install. A change to the docs
  # alone runs nothing below (a skipped job counts as passed). A merge to master runs everything.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      units: ${{ steps.files.outputs.units }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            { echo "code=true"; echo "units=all"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          echo "$files"
          # Docs: the docs tree, Markdown and HTML anywhere, the license. Never tested.
          code=$(grep -vqE '^docs/|\.md$|\.html?$|^LICENSE$' <<< "$files" && echo true || echo false)
          # The unit tests of each package the change touches. The files every test reads (the
          # lockfile, the configs, the control database's migrations) run them all; config/app.env,
          # which names the models, is the factory's.
          if grep -qE '^(package(-lock)?\.json|vitest\.config\.ts|tsconfig[^/]*\.json|packages/db/prisma/)' <<< "$files"; then
            units=all
          else
            units=$( { grep -oE '^(apps|packages)/[^/]+/' <<< "$files" || true
                       grep -qx 'config/app.env' <<< "$files" && echo apps/factory/ || true; } | sort -u | tr '\n' ' ')
          fi
          { echo "code=$code"; echo "units=$units"; } >> "$GITHUB_OUTPUT"

  # Its name is the check the master branch's ruleset requires, so it must report on every pull
  # request: skipped, for a change to the docs alone, counts as passed. It runs the secrets scan
  # first (a pull request's own commits; on master, the whole history), then the types, lint and
  # import boundaries.
  checks:
    name: no secrets in history
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On master, the whole history; on a pull request, its own commits are fetched below.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      - name: No secrets (gitleaks)
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          scan=("$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1)
          if [ "$EVENT" = pull_request ]; then
            # The pull request's commits and the one under them, so the first has a parent.
            git fetch -q --no-tags --depth=$((COMMITS + 1)) origin "$HEAD_SHA"
            "${scan[@]}" --log-opts="--max-count=$COMMITS $HEAD_SHA" .
          else
            "${scan[@]}" .
          fi
      - uses: ./.github/actions/node
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control
      - run: npx prisma validate --schema apps/memory/prisma/schema.prisma
        env:
          MEMORY_DATABASE_URL: postgresql://ci:ci@localhost:5432/memory
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise

  # The unit tests of the packages a pull request touches, with no browser.
  unit:
    name: unit tests
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.units != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - name: The touched packages' tests
        env:
          UNITS: ${{ needs.changes.outputs.units }}
        run: |
          if [ "$UNITS" = all ]; then dirs=$(ls -d apps/*/test packages/*/test)
          else dirs=$(for p in $UNITS; do [ -d "${p}test" ] && echo "${p}test"; done); fi
          [ -n "$dirs" ] || { echo "no tests in $UNITS"; exit 0; }
          echo "$dirs"
          # shellcheck disable=SC2086 # one argument per directory
          npx vitest run $dirs --bail=1 --passWithNoTests --exclude '**/node_modules/**' --exclude 'packages/runtime/test/**'

  # On master, the whole suite, in four parts at once.
  suite:
    name: the whole suite (${{ matrix.shard }} of 4)
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - uses: actions/cache@v4
        with:
          path: .run/browser
          key: chrome-${{ runner.os }}-${{ hashFiles('infra/scripts/browser.sh') }}
      - name: Headless Chromium
        run: '[ -d .run/browser/chrome ] || infra/scripts/browser.sh'
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  # On master only: the Node image every service runs, and the Runner's on top of it.
  images:
    name: the images build
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/node.Dockerfile -t generic-bank/node:ci .
      - run: docker build -f infra/docker/runner.Dockerfile --build-arg BASE=generic-bank/node:ci -t generic-bank/runner:ci .
