name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run it replaces. Master's runs all finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

# Memory's embedding runtime runs on CPU: npm ci fetches no GPU libraries for it.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    name: typecheck, lint, test, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a pull request's tests can be chosen by what it changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
        env:
          CONTROL_DATABASE_URL: postgresql://ci:ci@localhost:5432/control
      - run: npx prisma validate --schema apps/memory/prisma/schema.prisma
        env:
          MEMORY_DATABASE_URL: postgresql://ci:ci@localhost:5432/memory
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise
      - name: Headless Chromium for the browser tests
        run: infra/scripts/browser.sh
      # A pull request runs the tests its change touches; a change to migrations, seeds, config,
      # infrastructure or CI runs them all (vitest.config.ts, forceRerunTriggers). A merge to master
      # runs the whole suite.
      - name: The tests this change touches
        if: github.event_name == 'pull_request'
        run: npx vitest run --changed origin/${{ github.base_ref }} --passWithNoTests
      - name: The whole suite
        if: github.event_name != 'pull_request'
        run: npx vitest run

  secrets:
    name: no secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
